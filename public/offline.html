<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sin conexión · Control de Asistencia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #475569; line-height: 1.5; }
      button {
        margin-top: 1rem;
        height: 3rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0f766e;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Para registrar una entrada o salida necesitás conexión a internet. Revisá tu señal e intentá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
